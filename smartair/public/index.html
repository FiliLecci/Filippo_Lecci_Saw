<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="./favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2196f3" />
    <meta name="description" content="SmartAir - Monitora la qualità dell'aria" />
    <link rel="manifest" href=".webmanifest" />
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('%PUBLIC_URL%/sw.js').then((registration) => {
          console.log('Service Worker registrato:', registration);
        }).catch((error) => {
          console.error('Errore registrazione Service Worker:', error);
        });
      }
    </script>
    <title>SmartAir</title>
  </head>
  <body>
    <noscript>Hai bisogno di JavaScript per usare questa app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
